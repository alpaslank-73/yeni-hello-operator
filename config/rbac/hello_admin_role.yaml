# This rule is not used by the project yeni-hello-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over alpapigroup.perception.com.tr.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: yeni-hello-operator
    app.kubernetes.io/managed-by: kustomize
  name: hello-admin-role
rules:
- apiGroups:
  - alpapigroup.perception.com.tr
  resources:
  - hellos
  verbs:
  - '*'
- apiGroups:
  - alpapigroup.perception.com.tr
  resources:
  - hellos/status
  verbs:
  - get
